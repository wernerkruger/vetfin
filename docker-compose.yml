# Local production-like stack (also used on AWS EC2 — see README)
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./api/.env
    environment:
      # Security checks (encryption key / JWT). Public URLs still follow APP_ENV from api/.env.
      NODE_ENV: production
      # Local compose: leave APP_ENV unset/development + PUBLIC_APP_URL=http://localhost in api/.env.
      # AWS: set APP_ENV=production and the real host (see deploy/aws/.env.production.example).
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /data/vetfin.sqlite
    volumes:
      - vetfin-data:/data
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vetfin-data:
